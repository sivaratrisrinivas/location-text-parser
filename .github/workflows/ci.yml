name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest
      - run: python -m pytest -q
      - name: eval (rules, offline) must not regress
        run: |
          python -m evals.run_eval rules heldout | tail -1
          python - <<'P'
          from evals.run_eval import score
          _, acc, allok, n = score("rules", "heldout")
          assert allok >= 11, f"held-out all-fields dropped to {allok}/{n}"
          assert acc["india"] == n and acc["conflict"] == n
          P
      - name: README has no em dashes
        run: "! grep -n $'\u2014' README.md"
